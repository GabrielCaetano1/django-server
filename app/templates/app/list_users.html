<!DOCTYPE html>
<html>
<body>
  <h1>Users</h1>
  <a href="{% url 'criar_user' %}">+ Novo usuário</a>

  <ul>
    {% for user in users %}
      <li>
        {{ user.username }}
        <a href="{% url 'editar_user' user.pk %}">Editar</a>
        <a href="{% url 'deletar_user' user.pk %}">Deletar</a>
      </li>
    {% empty %}
      <li>Nenhum usuário ainda.</li>
    {% endfor %}
  </ul>
</body>
</html>
